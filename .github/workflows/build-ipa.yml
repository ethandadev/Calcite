name: Build IPA
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select newest Xcode (upstream needs the iOS 26 SDK)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version
      - name: JDK 8 (boot JDK for the Java app build)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "8"
      - name: Tools
        run: brew install make ldid cmake ninja
      - name: Build
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          export BOOTJDK="$JAVA_HOME/bin"
          gmake -j"$(sysctl -n hw.ncpu)" dsym package PLATFORM=2 RELEASE=1 RUNNER=1
      - name: Collect IPA
        run: |
          mkdir -p out
          cp artifacts/dev.ethandadev.calcite-*-ios.ipa out/Calcite.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Calcite-ipa
          path: out/Calcite.ipa
