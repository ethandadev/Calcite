name: Build IPA
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release with this tag (e.g. v0.1.1). Leave empty for a plain build."
        required: false
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select newest Xcode (upstream needs the iOS 26 SDK)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version
      - name: JDK 8 (boot JDK for the Java app build)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "8"
      - name: Tools
        run: brew install make ldid cmake ninja xcodegen
      - name: Build on-device pairing library (Rust)
        run: |
          rustup target add aarch64-apple-ios
          cd Natives/pairing
          IPHONEOS_DEPLOYMENT_TARGET=17.0 cargo build --release --locked --target aarch64-apple-ios
          cp target/aarch64-apple-ios/release/libcalcite_pairing.a .
      - name: Build StikJIT (built-in JIT engine, MPL-2.0)
        run: |
          git clone --depth 1 --branch 1.9.0 https://github.com/StikDebug/StikJIT "$RUNNER_TEMP/StikJIT"
          cd "$RUNNER_TEMP/StikJIT"
          xcodegen generate
          xcodebuild archive -scheme StikJIT -destination 'generic/platform=iOS' \
            -archivePath build/StikJIT BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p "$GITHUB_WORKSPACE/depends"
          cp -R build/StikJIT.xcarchive/Products/Library/Frameworks/StikJIT.framework "$GITHUB_WORKSPACE/depends/"
          ls "$GITHUB_WORKSPACE/depends/StikJIT.framework"
      - name: Cache LWJGL 3.4 native stack (Minecraft 26.3+)
        id: stack341
        uses: actions/cache@v4
        with:
          path: Natives/resources/Frameworks341
          key: stack341-${{ hashFiles('scripts/fetch-stack341.sh') }}
      - name: Fetch/build LWJGL 3.4 native stack
        if: steps.stack341.outputs.cache-hit != 'true'
        run: scripts/fetch-stack341.sh
      - name: Build LWJGL 3.4 Java stack
        run: |
          export BOOTJDK="$JAVA_HOME/bin"
          scripts/build-java341.sh
      - name: Stamp app version from the release tag
        run: |
          TAG="${{ inputs.release }}"; [ -z "$TAG" ] && [ "${GITHUB_REF_TYPE}" = tag ] && TAG="${GITHUB_REF_NAME}"
          if [ -n "$TAG" ]; then
            V="${TAG#v}"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" -c "Set :CFBundleVersion $V" Natives/Info.plist
          fi
      - name: Build
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          export BOOTJDK="$JAVA_HOME/bin"
          gmake -j"$(sysctl -n hw.ncpu)" dsym package PLATFORM=2 RELEASE=1
      - name: Collect IPA
        run: |
          mkdir -p out
          cp artifacts/dev.ethandadev.calcite-*-ios.ipa out/Calcite.ipa
      - name: Verify bundles are installable
        run: |
          rm -rf verify && mkdir verify && unzip -q out/Calcite.ipa -d verify
          bad=0
          for b in verify/Payload/*.app/Frameworks/*.framework verify/Payload/*.app/PlugIns/*.appex; do
            [ -f "$b/Info.plist" ] || { echo "MISSING Info.plist: $b"; bad=1; }
          done
          exit $bad
      - uses: actions/upload-artifact@v4
        with:
          name: Calcite-ipa
          path: out/Calcite.ipa
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release }}"; [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" out/Calcite.ipa --title "Calcite $TAG" --generate-notes || gh release upload "$TAG" out/Calcite.ipa --clobber
