name: Build IPA
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project Calcite.xcodeproj -scheme Calcite \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/Calcite.app Payload/
          zip -qry Calcite.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Calcite-ipa
          path: Calcite.ipa
