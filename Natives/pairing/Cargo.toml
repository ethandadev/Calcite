[package]
name = "calcite_pairing"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-only"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[dependencies]
idevice = { version = "=0.1.68", default-features = false, features = ["remote_pairing", "ring"] }
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "time"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
